name: Publish Windows release

on:
  push:
    branches: [main]
    paths:
      - 'releases/v*.md'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'goliom/tiny-telegram-file-compressor'
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from app_identity import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version' }
          if (-not (Test-Path -LiteralPath "releases/v$version.md")) { throw 'Release notes missing' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Ensure 7-Zip is installed
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Test, build and verify Windows executable
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-v${{ steps.version.outputs.version }}
          path: dist/v${{ steps.version.outputs.version }}/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-v${{ needs.build.outputs.version }}
          path: release-assets
      - name: Verify checksums and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace it."
            exit 1
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Tiny Telegram File Compressor $tag" \
            --notes-file "releases/$tag.md" \
            --latest
