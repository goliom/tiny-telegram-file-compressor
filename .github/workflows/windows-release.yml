name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Ensure 7-Zip is installed
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files\7-Zip\7z.exe')) {
            choco install 7zip --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Test, build and verify Windows executable
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: TinyTelegramFileCompressor-windows-x64-release
          path: dist/v*/*
          if-no-files-found: error
          retention-days: 14
